services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-express:
    image: mongo-express:1.0.2
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH_ENABLED: "false"

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/nestjs_mongodb?directConnection=true

  app:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/nestjs_mongodb?directConnection=true
      ORDERS_DUAL_WRITE: "false"
      ORDERS_READ_FROM_V2: "false"

volumes:
  mongo-data:
